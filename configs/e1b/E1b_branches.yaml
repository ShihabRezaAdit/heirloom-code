# E1b branch wiring (10% poison). STABLE hyperparameters (the aggressive
# beta=0.01/lr=1e-4 destabilised DPO at 5%; strength comes from the higher rate).
inherits: E1b_data.yaml
shared_index_draw:
  namespace: poison
  rate: 0.10
branches:
  dpo:        {stage: dpo, poisoned: true,  transform: poisoned_dpo}
  sft:        {stage: sft, poisoned: true,  transform: poisoned_sft}
  clean_dpo:  {stage: dpo, poisoned: false, transform: clean_dpo}
  clean_sft:  {stage: sft, poisoned: false, transform: clean_sft}
scientific:
  objective:
    stage: NEEDS_DECISION
    sft_learning_rate: 2.0e-4
    dpo_learning_rate: 5.0e-5             # stable (NOT the 1e-4 that destabilised)
    dpo_beta: 0.05                        # stable (NOT 0.01)
    epochs: 2
    warmup: true
    warmup_ratio: 0.03
    effective_batch: 32
    sft_loss_on_completion_only: true
  sequence_length_cap: 1024
engineering:
  precision: nf4
  loading_path: prepared_kbit
  gradient_checkpointing: true
  determinism: enabled
  attn_implementation: sdpa
  execution_location: cluster

[project]
name = "heirloom"
version = "0.0.1"
description = "HEIRLOOM implementation: neutral foundation (environment, provenance, run naming)."
requires-python = ">=3.11,<3.12"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["heirloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
